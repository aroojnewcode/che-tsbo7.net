# Static Astro site on Workers Assets. Cloudflare Builds runs `npx wrangler deploy`.
# Worker name must match Cloudflare Workers Builds project (h-ckstarkov-com).
name = "h-ckstarkov-com"
main = "src/worker.js"
compatibility_date = "2026-10-26"
workers_dev = true

# Custom domain (uncomment when hackstarkov.com is on this Cloudflare account):
# [[routes]]
# pattern = "hackstarkov.com/*"
# zone_name = "hackstarkov.com"
# [[routes]]
# pattern = "www.hackstarkov.com/*"
# zone_name = "hackstarkov.com"

[build]
command = "node scripts/cf-build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
