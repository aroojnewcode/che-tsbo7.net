# Static Astro site on Workers Assets. Cloudflare Builds runs `npx wrangler deploy`.
# Worker name must match Cloudflare Workers Builds project (cheatsbo7-net).
name = "cheatsbo7-net"
main = "src/worker.js"
compatibility_date = "2026-10-26"
workers_dev = true

# Custom domain (uncomment when cheatsbo7.net is on this Cloudflare account):
# [[routes]]
# pattern = "cheatsbo7.net/*"
# zone_name = "cheatsbo7.net"
# [[routes]]
# pattern = "www.cheatsbo7.net/*"
# zone_name = "cheatsbo7.net"

[build]
command = "node scripts/cf-build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
